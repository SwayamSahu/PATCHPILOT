[project]
name = "patchpilot"
version = "0.1.0"
description = "AI production engineer: from incident to verified fix, with a human in control."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "mcp>=2.0",  # 2.x renamed FastMCP to MCPServer; 1.x fails at import
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "simulator/checkout-service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# PatchPilot is a monorepo of services, not an importable library. Declaring no
# modules keeps `pip install -e .` working purely as a dependency lockstep.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
